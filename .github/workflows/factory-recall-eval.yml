name: Factory recall evaluation

on:
  pull_request:
    paths:
      - "evals/recall/**"
      - ".github/workflows/factory-recall-eval.yml"
      - "biome.json"
  push:
    branches: [main]
    paths:
      - "evals/recall/**"
      - ".github/workflows/factory-recall-eval.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-recall-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Evaluator (Bun ${{ matrix.bun }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        bun: ["1.3.4", "1.4.0"]
    defaults:
      run:
        working-directory: evals/recall
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run check-types
      - run: bun test
      - run: git diff --check
